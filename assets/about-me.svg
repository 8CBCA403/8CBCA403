<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">About 8CBCA403</title>
  <desc id="desc">A neon terminal card introducing 8CBCA403, an open-source developer based in East Asia.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#30363d" stroke-width="1" opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="996" height="276" rx="16"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="996" height="276" rx="16" fill="#0d1117" stroke="url(#border)" stroke-width="3"/>
  <g clip-path="url(#cardClip)">
    <rect x="2" y="2" width="996" height="276" fill="url(#grid)"/>
    <circle cx="870" cy="40" r="150" fill="#7c3aed" opacity="0.06"/>
    <circle cx="955" cy="240" r="125" fill="#00d4ff" opacity="0.05"/>
  </g>

  <circle cx="30" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="27" r="6" fill="#27c93f"/>
  <text x="500" y="33" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="2">8CBCA403 // PROFILE</text>
  <line x1="20" y1="51" x2="980" y2="51" stroke="#30363d"/>

  <text x="42" y="89" fill="#00d4ff" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" filter="url(#glow)">&gt; WHO_AM_I</text>
  <text x="42" y="127" fill="url(#titleGradient)" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">Open-source developer</text>
  <text x="42" y="158" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="17">Building useful tools, exploring ideas, and sharing the results.</text>
  <text x="42" y="187" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="16">Based in East Asia  /  好雨知时节，当春乃发生</text>

  <rect x="640" y="76" width="320" height="65" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="660" y="101" fill="#ec4899" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700">FOCUS</text>
  <text x="660" y="125" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="16">Developer Tools  •  Pokémon Data</text>

  <rect x="640" y="153" width="320" height="65" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="660" y="178" fill="#7c3aed" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700">TOOLBOX</text>
  <text x="660" y="202" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="16">C#  •  .NET  •  Git  •  Open Source</text>

  <rect x="28" y="229" width="944" height="33" rx="8" fill="#010409" stroke="#21262d"/>
  <text x="45" y="251" fill="#27c93f" font-family="Consolas, Menlo, monospace" font-size="14">$</text>
  <text x="64" y="251" fill="#c9d1d9" font-family="Consolas, Menlo, monospace" font-size="14">stay curious</text>
  <text x="178" y="251" fill="#8b949e" font-family="Consolas, Menlo, monospace" font-size="14">&amp;&amp;</text>
  <text x="212" y="251" fill="#c9d1d9" font-family="Consolas, Menlo, monospace" font-size="14">build boldly</text>
  <text x="326" y="251" fill="#8b949e" font-family="Consolas, Menlo, monospace" font-size="14">&amp;&amp;</text>
  <text x="360" y="251" fill="#c9d1d9" font-family="Consolas, Menlo, monospace" font-size="14">share openly</text>
  <rect x="474" y="239" width="9" height="15" fill="#00d4ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
